name: Sync Spotify albums

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spotify-albums
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh _data/albums.yml from Spotify
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: ruby scripts/sync_spotify_albums.rb

      - name: Commit and push if the album list changed
        run: |
          if git diff --quiet -- _data/albums.yml; then
            echo "No album changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/albums.yml
          git commit -m "Sync Spotify albums"
          git push
